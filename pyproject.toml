[project]
name = "mission-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "gradio>=6",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "openai>=1.40",
    "packaging>=26.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "ruff>=0.17.3",
    "svgwrite>=1.4.3",
    "tavily-python>=0.8.5",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "libsql",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]
desktop = ["mss", "pillow", "keyboard", "krpc"]

[project.scripts]
kerbal-copilot = "kerbal_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kerbal_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
