name: ci
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_WRITE_TOKEN"]).upload_folder(
              folder_path=".",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              ignore_patterns=["data/*", "tests/*", "desktop/*", ".git/*", ".github/*", "*.db"]
          )
          EOF