<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" role="img">
<title>Kerbal Copilot architecture</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#B4B2A9}
.cont{fill:none;stroke:#B4B2A9;stroke-dasharray:4 4}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}
.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="480" fill="#FFFFFF"/>
<rect class="cont" x="40" y="30" width="302" height="108" rx="12" stroke-width="0.5"/>
<text class="th" x="56" y="50" dominant-baseline="central">Gaming PC</text>
<g class="c-purple"><rect x="56" y="66" width="128" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="84" text-anchor="middle" dominant-baseline="central">KSP + mods</text>
<text class="ts" x="120" y="104" text-anchor="middle" dominant-baseline="central">GameData, CKAN</text></g>
<g class="c-purple"><rect x="200" y="66" width="126" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="263" y="84" text-anchor="middle" dominant-baseline="central">Ingest CLI</text>
<text class="ts" x="263" y="104" text-anchor="middle" dominant-baseline="central">Makes parts.db</text></g>
<rect class="cont" x="362" y="30" width="278" height="108" rx="12" stroke-width="0.5"/>
<text class="th" x="378" y="50" dominant-baseline="central">Laptop</text>
<g class="c-purple"><rect x="378" y="66" width="246" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="501" y="84" text-anchor="middle" dominant-baseline="central">Code, tests, browser</text>
<text class="ts" x="501" y="104" text-anchor="middle" dominant-baseline="central">Your dev machine</text></g>
<line x1="263" y1="124" x2="263" y2="198" class="arr" marker-end="url(#arrow)"/>
<line x1="501" y1="124" x2="501" y2="198" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="200" width="302" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="191" y="218" text-anchor="middle" dominant-baseline="central">Private HF dataset</text>
<text class="ts" x="191" y="238" text-anchor="middle" dominant-baseline="central">parts.db, mods, tech tree</text></g>
<rect class="box" x="362" y="200" width="278" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="501" y="218" text-anchor="middle" dominant-baseline="central">GitHub repo + Actions</text>
<text class="ts" x="501" y="238" text-anchor="middle" dominant-baseline="central">Tests, then deploys</text>
<line x1="191" y1="258" x2="191" y2="298" class="arr" marker-end="url(#arrow)"/>
<path d="M501 258 L501 278 L440 278 L440 298" class="arr" marker-end="url(#arrow)"/>
<rect class="cont" x="40" y="300" width="440" height="140" rx="12" stroke-width="0.5"/>
<text class="th" x="56" y="320" dominant-baseline="central">Hosted app (Hugging Face Space)</text>
<g class="c-teal"><rect x="56" y="344" width="128" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="362" text-anchor="middle" dominant-baseline="central">Gradio UI</text>
<text class="ts" x="120" y="382" text-anchor="middle" dominant-baseline="central">Chat, viewer</text></g>
<g class="c-teal"><rect x="198" y="344" width="128" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="262" y="362" text-anchor="middle" dominant-baseline="central">Agent loop</text>
<text class="ts" x="262" y="382" text-anchor="middle" dominant-baseline="central">Tool calling</text></g>
<g class="c-teal"><rect x="340" y="344" width="128" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="404" y="362" text-anchor="middle" dominant-baseline="central">Data layer</text>
<text class="ts" x="404" y="382" text-anchor="middle" dominant-baseline="central">Parts, builds</text></g>
<rect class="box" x="510" y="304" width="130" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="575" y="324" text-anchor="middle" dominant-baseline="central">OpenRouter</text>
<rect class="box" x="510" y="354" width="130" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="575" y="374" text-anchor="middle" dominant-baseline="central">Turso DB</text>
<rect class="box" x="510" y="404" width="130" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="575" y="424" text-anchor="middle" dominant-baseline="central">Mod sources</text>
<line x1="482" y1="324" x2="508" y2="324" class="arr" marker-end="url(#arrow)"/>
<line x1="482" y1="374" x2="508" y2="374" class="arr" marker-end="url(#arrow)"/>
<line x1="482" y1="424" x2="508" y2="424" class="arr" marker-end="url(#arrow)"/>
</svg>
