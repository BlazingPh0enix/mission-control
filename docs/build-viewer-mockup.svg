<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>Build viewer mockup (illustrative numbers)</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#B4B2A9}
.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-coral{fill:#FAECE7;stroke:#993C1D}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3}
</style>
<rect width="680" height="440" fill="#FFFFFF"/>
<rect class="box" x="40" y="20" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="ts" x="56" y="38" dominant-baseline="central">Total Δv (vac)</text>
<text class="th" x="56" y="60" dominant-baseline="central">6,310 m/s</text>
<rect class="box" x="193" y="20" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="ts" x="209" y="38" dominant-baseline="central">Mission needs</text>
<text class="th" x="209" y="60" dominant-baseline="central">5,900 m/s</text>
<rect class="box" x="346" y="20" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="ts" x="362" y="38" dominant-baseline="central">Margin</text>
<text class="th" x="362" y="60" dominant-baseline="central">+410 m/s</text>
<rect class="box" x="499" y="20" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="ts" x="515" y="38" dominant-baseline="central">Launch TWR</text>
<text class="th" x="515" y="60" dominant-baseline="central">1.45</text>
<polygon class="c-gray" points="150,120 166,152 134,152" stroke-width="0.5"/>
<rect class="c-teal" x="128" y="154" width="44" height="30" rx="2" stroke-width="0.5"/>
<polygon class="c-coral" points="143,184 157,184 161,194 139,194" stroke-width="0.5"/>
<line x1="128" y1="184" x2="118" y2="196" stroke="#888780" stroke-width="1"/>
<line x1="172" y1="184" x2="182" y2="196" stroke="#888780" stroke-width="1"/>
<rect class="c-gray" x="126" y="196" width="48" height="4" rx="1" stroke-width="0.5"/>
<rect class="c-teal" x="126" y="202" width="48" height="50" rx="2" stroke-width="0.5"/>
<polygon class="c-coral" points="140,252 160,252 165,266 135,266" stroke-width="0.5"/>
<rect class="c-gray" x="124" y="268" width="52" height="4" rx="1" stroke-width="0.5"/>
<rect class="c-teal" x="124" y="274" width="52" height="100" rx="2" stroke-width="0.5"/>
<polygon class="c-coral" points="136,374 164,374 170,390 130,390" stroke-width="0.5"/>
<polygon class="c-gray" points="96,290 108,274 120,290" stroke-width="0.5"/>
<rect class="c-teal" x="96" y="290" width="24" height="80" rx="2" stroke-width="0.5"/>
<polygon class="c-coral" points="100,370 116,370 119,382 97,382" stroke-width="0.5"/>
<polygon class="c-gray" points="180,290 192,274 204,290" stroke-width="0.5"/>
<rect class="c-teal" x="180" y="290" width="24" height="80" rx="2" stroke-width="0.5"/>
<polygon class="c-coral" points="184,370 200,370 203,382 181,382" stroke-width="0.5"/>
<line class="leader" x1="172" y1="136" x2="274" y2="136"/>
<text class="th" x="282" y="128" dominant-baseline="central">Command pod</text>
<text class="ts" x="282" y="146" dominant-baseline="central">Chute, heat shield</text>
<line class="leader" x1="180" y1="174" x2="274" y2="174"/>
<text class="th" x="282" y="166" dominant-baseline="central">S3 lander</text>
<text class="ts" x="282" y="184" dominant-baseline="central">1,260 m/s · TWR 2.1 on the Mun</text>
<line class="leader" x1="182" y1="227" x2="274" y2="227"/>
<text class="th" x="282" y="219" dominant-baseline="central">S2 transfer</text>
<text class="ts" x="282" y="237" dominant-baseline="central">1,450 m/s · TWR 0.9</text>
<line class="leader" x1="212" y1="330" x2="274" y2="330"/>
<text class="th" x="282" y="322" dominant-baseline="central">S1 boosters + core</text>
<text class="ts" x="282" y="340" dominant-baseline="central">3,600 m/s · TWR 1.45 at liftoff</text>
<rect class="c-teal" x="40" y="412" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="58" y="418" dominant-baseline="central">Fuel tanks</text>
<rect class="c-coral" x="150" y="412" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="168" y="418" dominant-baseline="central">Engines</text>
<rect class="c-gray" x="244" y="412" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="262" y="418" dominant-baseline="central">Pods, decouplers, nose cones</text>
</svg>
